<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RS Vietnam Trip</title>
  <meta name="description" content="Offline travel guide for Hanoi, Ha Long Bay and Ninh Binh">
  <meta name="theme-color" content="#B3261E">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Update banner (shown by app.js when a new version is ready) -->
  <button id="update-banner" class="update-banner" hidden>New version available — tap to update</button>

  <!-- Top bar: screen title + back button for sub-screens -->
  <header class="topbar">
    <button id="back-btn" class="back-btn" hidden aria-label="Back">‹ Back</button>
    <h1 id="screen-title">Today</h1>
    <a href="#sos" class="sos-top" aria-label="SOS emergency">SOS</a>
  </header>

  <!-- All screens render here -->
  <main id="screen" tabindex="-1"></main>

  <!-- v2.1: 🎤 = translator (big), 💬 = ask the helper (small). SOS lives in the top bar on every screen -->
  <a href="#translate" id="mic-btn" class="sos-btn mic-btn" aria-label="Translate: speak with Vietnamese people">🎤</a>
  <a href="#chat" id="chat-btn" class="sos-btn chat-btn" aria-label="Ask the trip helper">💬</a>

  <!-- Bottom tab bar: 5 tabs -->
  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today"><span class="ti">☀</span><span>Today</span></a>
    <a href="#plan"  data-tab="plan"><span class="ti">🗺</span><span>Plan</span></a>
    <a href="#money" data-tab="money"><span class="ti">₫</span><span>Money</span></a>
    <a href="#food"  data-tab="food"><span class="ti">🍽</span><span>Food</span></a>
    <a href="#more"  data-tab="more"><span class="ti">▦</span><span>More</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/trip.js"></script>
  <script src="js/today.js"></script>
  <script src="js/money.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/story.js"></script>
  <script src="js/food.js"></script>
  <script src="js/phrases.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/prep.js"></script>
  <script src="js/emergency.js"></script>
  <script src="js/ask.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/cash.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/weather.js"></script>
</body>
</html>
